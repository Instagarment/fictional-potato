# Render Blueprint: render.com → New → Blueprint → pick this GitHub repo.
# Render reads this file and sets up the web service and its disk for you.
# You'll be asked for the values marked "sync: false".
services:
  - type: web
    name: instagarment-pod
    runtime: node
    # "starter" stays awake and allows a disk (needed). The free plan can't have a disk.
    plan: starter
    region: oregon
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATA_DIR
        value: /var/data
      - key: SHOPIFY_CLIENT_ID
        sync: false
      - key: SHOPIFY_CLIENT_SECRET
        sync: false
      - key: APP_URL
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: ALERT_EMAIL_TO
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_SECURE
        value: "true"
